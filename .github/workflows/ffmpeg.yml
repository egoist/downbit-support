name: FFmpeg

# Publishes a release of the FFmpeg builds Downbit downloads to convert:
# ffmpeg-<version>, unless there is one.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, check and repackage the builds
        run: ./ffmpeg/build.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat out/tag)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is released already: its archives stay as they are"
            exit 0
          fi
          gh release create "$tag" out/ffmpeg-*.zip out/checksums.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FFmpeg ${tag#ffmpeg-}" --notes-file out/notes.md
